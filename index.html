<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Forest Frontier</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="firebase-config.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f0a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eef3ee;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{display:block;position:fixed;inset:0}
canvas#ov{position:fixed;inset:0;pointer-events:none;z-index:2}
.hide{display:none!important}
#hud{position:fixed;top:8px;left:8px;right:160px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:5;pointer-events:none}
.pill{background:rgba(12,18,14,.82);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;font-size:14px;white-space:nowrap;pointer-events:auto}
.pill b{font-variant-numeric:tabular-nums}
#hThreatP.warn{background:rgba(170,25,25,.92);animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
button{font:inherit;color:inherit;cursor:pointer}
.hbtn{background:#2b4a2f;border:1px solid #5c8f5f;border-radius:999px;padding:5px 12px;font-size:14px;pointer-events:auto}
.hbtn:hover{background:#376140}
#buildbar{position:fixed;left:50%;transform:translateX(-50%);bottom:8px;display:flex;gap:6px;max-width:calc(100% - 16px);overflow-x:auto;padding:6px;background:rgba(12,18,14,.85);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.14);border-radius:14px;z-index:5}
.bb{min-width:80px;background:#1d2a1f;border:2px solid #34503a;border-radius:10px;padding:4px 6px;text-align:center;font-size:12px;line-height:1.25;position:relative}
.bb:hover{background:#26382a}
.bb .ic{font-size:22px;display:block}
.bb .cost{opacity:.85;font-size:11px}
.bb .key{position:absolute;top:2px;left:5px;font-size:10px;opacity:.55}
.bb.sel{border-color:#ffd166;background:#3a3a1d}
.bb.na{opacity:.45}
#prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;z-index:6}
#prompt button{background:#b42318;border:2px solid #ff8a7a;border-radius:12px;padding:10px 18px;font-size:16px;font-weight:700;box-shadow:0 4px 18px rgba(0,0,0,.5)}
#toast{position:fixed;top:54px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:7px 14px;border-radius:8px;font-size:14px;z-index:30;pointer-events:none;transition:opacity .35s;opacity:0;max-width:90vw;text-align:center}
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
#modal{background:rgba(22,32,26,.96);border:1px solid #3d5c44;border-radius:16px;max-width:580px;width:100%;max-height:92vh;overflow:auto;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#modal h1{margin:0 0 4px;font-size:30px}
#modal h2{margin:0 0 10px}
#modal p,#modal li{line-height:1.45;font-size:14.5px}
#modal ul{padding-left:20px;margin:6px 0}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{background:#2b4a2f;border:1px solid #5c8f5f;border-radius:10px;padding:9px 16px;font-size:15px}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:#c27c0e;border-color:#ffd166;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.urow{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;background:#1d2a1f;margin:6px 0}
.urow .ic{font-size:28px;width:38px;text-align:center}
.urow .info{flex:1;font-size:13px;line-height:1.35}
.urow .info b{font-size:15px}
.urow .tb{display:flex;flex-direction:column;gap:4px}
.urow .tb .btn{padding:5px 10px;font-size:13px}
.lock{color:#ff9a8a}
#bpanel{position:fixed;left:0;right:0;bottom:0;background:rgba(12,18,14,.9);backdrop-filter:blur(4px);border-top:1px solid rgba(255,255,255,.14);padding:8px;z-index:5;display:flex;flex-direction:column;gap:6px;align-items:center}
#bpal,#bctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pb{background:#1d2a1f;border:2px solid #34503a;border-radius:10px;padding:5px 10px;font-size:14px}
.pb.sel{border-color:#ffd166;background:#3a3a1d}
.pb.zero{opacity:.4}
.cb{background:#2b4a2f;border:1px solid #5c8f5f;border-radius:10px;padding:6px 12px;font-size:14px}
.cb.fight{background:#b42318;border-color:#ff8a7a;font-weight:700;font-size:15px;padding:6px 18px}
.cb:disabled{opacity:.4}
#bhint{font-size:12.5px;opacity:.85;text-align:center;max-width:820px}
#minimap{position:fixed;right:8px;top:8px;width:144px;height:144px;border:2px solid rgba(255,255,255,.25);border-radius:8px;z-index:4;image-rendering:pixelated;background:#000;pointer-events:none}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:50;background:#0b0f0a}
@media (max-width:600px){#minimap{width:96px;height:96px}#hud{right:110px}.pill,.hbtn{font-size:12.5px;padding:4px 8px}.bb{min-width:66px;font-size:11px}#prompt{bottom:96px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="ov"></canvas>
<canvas id="minimap" width="256" height="256" class="hide"></canvas>

<div id="hud" class="hide">
  <span class="pill" title="Wood">🪵 <b id="hWood">0</b></span>
  <span class="pill" title="Stone">🪨 <b id="hStone">0</b></span>
  <span class="pill" title="Gold">🪙 <b id="hGold">0</b></span>
  <span class="pill" title="Soldiers at home / max army">👥 <b id="hArmy">0</b></span>
  <span class="pill" title="Health">❤️ <b id="hHp">100</b></span>
  <span class="pill" title="City size and wall level">🏰 <b id="hCity">Lv1</b></span>
  <span class="pill" title="Time of day and weather"><b id="hEnv">☀️ Day</b></span>
  <span class="pill" id="hThreatP" title="Enemy armies marching on you">⚠ <b id="hThreat">Calm</b></span>
  <span class="pill hide" id="hMarchP" title="Your marching army">🚩 <b id="hMarch"></b></span>
  <span class="pill" title="Rival cities conquered">👑 <b id="hBases">0/30</b></span>
  <span class="pill hide" id="hMpP" title="Online game room code" style="cursor:pointer">🌐 <b id="hMp"></b></span>
  <button class="hbtn" id="btnCity">🏰 City <small>(C)</small></button>
  <button class="hbtn" id="btnArmy">🎖 Army <small>(T)</small></button>
  <button class="hbtn" id="btnMarch">🚩 March <small>(M)</small></button>
  <button class="hbtn" id="btnAlly">🤝 Allies <small>(L)</small></button>
  <button class="hbtn" id="btnSave" title="Save now"><span id="hSave">💾 Save</span></button>
  <button class="hbtn" id="btnHelp">❓</button>
</div>
<div id="buildbar" class="hide"></div>

<div id="bpanel" class="hide">
  <div id="bpal"></div>
  <div id="bctl"></div>
  <div id="bhint"></div>
</div>

<div id="toast"></div>
<div id="modalBg" class="hide"><div id="modal"></div></div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
if(typeof THREE==='undefined'){document.body.insertAdjacentHTML('beforeend','<div id="err"><div><h2>Couldn\'t load the 3D engine</h2><p>Check your internet connection and reload the page.</p></div></div>');return;}

/* ================= RENDERER ================= */
const cv=$('c'),ov=$('ov'),ctx=ov.getContext('2d');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
let VW=0,VH=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;renderer.setPixelRatio(DPR);renderer.setSize(VW,VH);
  ov.width=VW*DPR;ov.height=VH*DPR;ov.style.width=VW+'px';ov.style.height=VH+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
const EMO='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const col=h=>new THREE.Color(h).convertSRGBToLinear();

/* ----- materials & geometry helpers ----- */
const MC=new Map();
function M(hex,rough=0.85,metal=0,extra){const k=hex+'|'+rough+'|'+metal+'|'+(extra?JSON.stringify(extra):'');if(MC.has(k))return MC.get(k);
  const o=Object.assign({roughness:rough,metalness:metal},extra||{});delete o.emissive;const m=new THREE.MeshStandardMaterial(o);m.color=col(hex);if(extra&&extra.emissive)m.emissive=col(extra.emissive);MC.set(k,m);return m;}
function makeRockGeo(){const g=new THREE.SphereGeometry(1,20,14);const p=g.attributes.position;const v=new THREE.Vector3();
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const n=v.clone().normalize();const r=1+.16*Math.sin(n.x*3.1+1.3)*Math.sin(n.y*2.3+.7)+.1*Math.sin(n.z*4.2+2.1)*Math.cos(n.x*2.7);v.copy(n).multiplyScalar(r);if(v.y<-.35)v.y=-.35-(v.y+.35)*.2;p.setXYZ(i,v.x,v.y,v.z);}
  g.computeVertexNormals();return g;}
const GEO={box:new THREE.BoxGeometry(1,1,1),sph:new THREE.SphereGeometry(1,22,16),hemi:new THREE.SphereGeometry(1,22,12,0,Math.PI*2,0,Math.PI/2),dode:makeRockGeo(),bow:new THREE.TorusGeometry(1,0.05,5,14,Math.PI),ring:new THREE.RingGeometry(0.93,1,48).rotateX(-Math.PI/2),plane:new THREE.PlaneGeometry(1,1).rotateX(-Math.PI/2),cyl:{},cone:{}};
const cylG=s=>{s=Math.max(s,14);return GEO.cyl[s]||(GEO.cyl[s]=new THREE.CylinderGeometry(1,1,1,s));};
const coneG=s=>{if(s>4)s=Math.max(s,16);return GEO.cone[s]||(GEO.cone[s]=new THREE.ConeGeometry(1,1,s));};
function part(g,geo,mat,sx,sy,sz,x,y,z,rx,ry,rz){const m=new THREE.Mesh(geo,mat);m.scale.set(sx,sy,sz);m.position.set(x,y,z);m.rotation.set(rx||0,ry||0,rz||0);m.castShadow=true;m.receiveShadow=true;g.add(m);return m;}
const box=(g,w,h,d,mat,x,y,z,rx,ry,rz)=>part(g,GEO.box,mat,w,h,d,x,y,z,rx,ry,rz);
const cyl=(g,r,h,mat,x,y,z,seg,rx,ry,rz)=>part(g,cylG(seg||12),mat,r,h,r,x,y,z,rx,ry,rz);
const cone=(g,r,h,mat,x,y,z,seg,ry)=>part(g,coneG(seg||8),mat,r,h,r,x,y,z,0,ry||0,0);
const sph=(g,r,mat,x,y,z,sy)=>part(g,GEO.sph,mat,r,sy||r,r,x,y,z);
const TG={trunk:new THREE.CylinderGeometry(.07,.11,.7,10).translate(0,.35,0),pine1:new THREE.ConeGeometry(.56,1.05,18).translate(0,1.0,0),pine2:new THREE.ConeGeometry(.4,.85,18).translate(0,1.58,0),
  oak:new THREE.SphereGeometry(.6,20,14).scale(1,.9,1).translate(0,1.2,0),stump:new THREE.CylinderGeometry(.11,.14,.16,12).translate(0,.08,0)};
const MAT={stone:()=>M('#8b8e93',.92),dstone:()=>M('#6a6d73',.92),wood:()=>M('#7a5230',.85),dwood:()=>M('#4e3420',.9),canvas:()=>M('#d9c9a3',.95),metal:()=>M('#b9c0c8',.35,.8),skin:()=>M('#d7a47a',.75),gold:()=>M('#e5b93a',.3,.85),hay:()=>M('#d8b85a',1),leather:()=>M('#5a3b24',.9),pine:()=>M('#2f5d2a',.9,0,{flatShading:false}),trunk:()=>M('#5b3a22',.95)};
let ENEMY_HEX='#b3261e';const teamHex=s=>s?ENEMY_HEX:'#2456b8';const darkHex=h=>'#'+new THREE.Color(h).multiplyScalar(.6).getHexString();
function makePine(g,x,z,s){windify(MAT.pine());windify(M('#356a30',.9,0,{flatShading:false}));const t=new THREE.Group();t.position.set(x,0,z);t.scale.setScalar(s);t.rotation.y=Math.random()*6;
  for(const [geo,mat] of [[TG.trunk,MAT.trunk()],[TG.pine1,MAT.pine()],[TG.pine2,M('#356a30',.9,0,{flatShading:false})]]){const m=new THREE.Mesh(geo,mat);m.castShadow=m.receiveShadow=true;t.add(m);}g.add(t);return t;}
function makeOak(g,x,z,s){windify(M('#4a7a2f',.9,0,{flatShading:false}));const t=new THREE.Group();t.position.set(x,0,z);t.scale.setScalar(s);for(const [geo,mat] of [[TG.trunk,MAT.trunk()],[TG.oak,M('#4a7a2f',.9,0,{flatShading:false})]]){const m=new THREE.Mesh(geo,mat);m.castShadow=m.receiveShadow=true;t.add(m);}g.add(t);return t;}

/* ================= DATA ================= */
const W=256,H=256,T=32,GTS=2048;
const GRASS=0,TREE=1,ROCK=2,WATER=3,STUMP=4,DIRT=5;
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
const BLD={
  city:{name:'City',icon:'🏰',r:7},
  outpost:{name:'Conquered City',icon:'🏰',r:9},
  turret:{name:'Arrow Tower',icon:'🗼',r:0,cost:{wood:12,stone:8},forge:0,range:6,dmg:16,cd:.9,desc:'Fires arrows. Steady damage.'},
  ballista:{name:'Ballista',icon:'🎯',r:0,cost:{wood:25,stone:15,gold:15},forge:1,range:7,dmg:30,cd:1.8,desc:'Huge bolts with long range. Great against Knights.'},
  catapult:{name:'Catapult',icon:'☄️',r:0,cost:{wood:35,stone:30,gold:30},forge:2,range:8,dmg:30,cd:2.6,desc:'Hurls boulders that hit a whole group.'},
};
const BORDER=['turret','ballista','catapult'];
const WEAPONS=['turret','ballista','catapult'];
const UPG={
  barracks:{name:'Barracks',icon:'🛡️',max:3,req:[0,1,2,3],cost:[null,{wood:25,stone:10},{wood:50,stone:30,gold:30},{wood:90,stone:60,gold:80}],desc:['Not built yet','Train Swordsmen and Spearmen','Also train Archers','Veteran training: +15% soldier health']},
  stable:{name:'Stable',icon:'🐎',max:2,req:[0,2,3],cost:[null,{wood:40,stone:20,gold:30},{wood:70,stone:40,gold:80}],desc:['Not built yet','Train Knights','Armored horses: +20% Knight health']},
  houses:{name:'Houses',icon:'🏠',max:5,req:[0,1,2,3,4,5],cost:[null,{wood:15},{wood:35},{wood:60,stone:20},{wood:90,stone:40,gold:30},{wood:130,stone:70,gold:60}],desc:l=>l?`+${4*l} army size`:'No extra houses'},
  mine:{name:'Gold Mine',icon:'⛏️',max:5,req:[0,1,2,3,4,5],cost:[null,{wood:10,stone:15},{wood:25,stone:35},{wood:40,stone:60,gold:20},{wood:60,stone:90,gold:50},{wood:90,stone:130,gold:90}],desc:l=>l?`+${l} gold every 3 seconds`:'Not built yet'},
  forge:{name:'Forge',icon:'⚒️',max:2,req:[0,2,3],cost:[null,{wood:30,stone:30,gold:20},{wood:60,stone:70,gold:60}],desc:['Arrow Towers only','Unlocks Ballistas','Unlocks Catapults']},
  turret:{name:'Arrow Towers',icon:'🗼',max:6,req:[0,1,1,2,2,3,3],cost:[null,{wood:12,stone:8},{wood:20,stone:15},{wood:30,stone:25},{wood:40,stone:35,gold:20},{wood:55,stone:50,gold:40},{wood:70,stone:65,gold:60}],desc:l=>l?`${l} Arrow Tower${l>1?'s':''} around your city`:'None yet'},
  ballista:{name:'Ballistas',icon:'🎯',max:4,needForge:1,req:[0,2,2,3,4],cost:[null,{wood:25,stone:15,gold:15},{wood:40,stone:30,gold:30},{wood:60,stone:45,gold:50},{wood:80,stone:60,gold:70}],desc:l=>l?`${l} Ballista${l>1?'s':''}: long range, great vs Knights`:'None yet (long range, great vs Knights)'},
  catapult:{name:'Catapults',icon:'☄️',max:3,needForge:2,req:[0,3,4,5],cost:[null,{wood:35,stone:30,gold:30},{wood:55,stone:50,gold:55},{wood:80,stone:70,gold:90}],desc:l=>l?`${l} Catapult${l>1?'s':''}: boulders hit whole groups`:'None yet (boulders hit whole groups)'},
};
const UPG_ORDER=['barracks','houses','mine','stable','forge','turret','ballista','catapult'];
const WSLOTS={turret:[[-4,-4],[4,-4],[-4,4],[4,4],[-5,0],[5,0]],ballista:[[-2,-4],[2,-4],[-4,2],[4,2]],catapult:[[0,-5],[-4,-2],[4,-2]]};
function syncWeapons(){G.buildings=G.buildings.filter(b=>!WEAPONS.includes(b.t));
  for(const t of WEAPONS)for(let k=0;k<(G.up[t]||0)&&k<WSLOTS[t].length;k++){const [dx,dy]=WSLOTS[t][k],x=G.home.x+dx,y=G.home.y+dy,i=y*W+x;if(G.tiles[i]!==DIRT)G.tiles[i]=GRASS;G.rq[i]=0;G.buildings.push({t,x,y});}
  recompute();if(player)unstick();}
const upDesc=(k,l)=>{const d=UPG[k].desc;return typeof d==='function'?d(l):d[l];};
const RICON={wood:'🪵',stone:'🪨',gold:'🪙'};
const UDEF={
  sword:{name:'Swordsman',icon:'⚔️',hp:110,atk:14,range:1,cd:0.9,move:0.45,cost:{gold:15},req:{barracks:1},bonus:{spear:1.4},desc:'Solid all-rounder. Strong vs Spearmen.'},
  spear:{name:'Spearman',icon:'🔱',hp:100,atk:12,range:1,cd:1.0,move:0.5,cost:{gold:15},req:{barracks:1},bonus:{knight:2.5},desc:'Crushes Knights (x2.5 damage).'},
  archer:{name:'Archer',icon:'🏹',hp:60,atk:11,range:4.5,cd:1.2,move:0.55,ranged:true,cost:{gold:20},req:{barracks:2},bonus:{sword:1.25,spear:1.25},desc:'Shoots from range. Extra range on hills.'},
  knight:{name:'Knight',icon:'🐎',hp:170,atk:20,range:1,cd:1.0,move:0.27,cost:{gold:35},req:{stable:1},bonus:{archer:1.7,turret:1.3,ballista:1.3,catapult:1.5},desc:'Fast and tough. Hunts Archers. Weak to Spears.'},
  turret:{name:'Arrow Tower',icon:'🗼',hp:220,atk:13,range:5.5,cd:1.1,static:true,ranged:true,bonus:{},desc:'Can\'t move. Shoots anything in range.'},
  ballista:{name:'Ballista',icon:'🎯',hp:160,atk:26,range:7,cd:2.2,static:true,ranged:true,bonus:{knight:1.6},desc:'Long range, big hits. Great against Knights.'},
  catapult:{name:'Catapult',icon:'☄️',hp:140,atk:22,range:8,cd:3.2,static:true,ranged:true,splash:true,bonus:{wall:2},desc:'Very long range. Boulders hurt everyone around the target.'},
  wall:{name:'Wall',icon:'🧱',hp:260,atk:0,static:true,desc:'City wall section.'}
};
const ARMY_T=['sword','spear','archer','knight'];

/* ================= UTIL ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeNoise(rand,scale){const N=Math.ceil(W/scale)+3;const g=new Float32Array(N*N);for(let i=0;i<g.length;i++)g[i]=rand();
  return (x,y)=>{const fx=x/scale,fy=y/scale,ix=Math.floor(fx),iy=Math.floor(fy);let tx=fx-ix,ty=fy-iy;tx=tx*tx*(3-2*tx);ty=ty*ty*(3-2*ty);
  const a=g[iy*N+ix],b=g[iy*N+ix+1],c=g[(iy+1)*N+ix],d=g[(iy+1)*N+ix+1];return a+(b-a)*tx+(c-a)*ty+(a-b-c+d)*tx*ty;};}
const hash=(x,y)=>(((x*73856093)^(y*19349663))>>>0)%1000;
function costStr(c){if(!c)return'';return Object.entries(c).map(([k,v])=>RICON[k]+v).join(' ');}
function afford(c){if(!c)return true;for(const k in c)if((G.res[k]||0)<c[k])return false;return true;}
function pay(c){for(const k in c)G.res[k]-=c[k];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const angLerp=(a,b,k)=>{let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return a+d*k;};
let toastTimer=0;
function toast(msg){const t=$('toast');t.textContent=msg;t.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.opacity=0,2400);}
function label(text,x,y,colr,size){ctx.font=`bold ${size||13}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3.5;ctx.strokeStyle='rgba(0,0,0,.75)';ctx.strokeText(text,x,y);ctx.fillStyle=colr||'#fff';ctx.fillText(text,x,y);}

const CIVNAMES=['Iron Clan','Sun Kingdom','Frost Tribe','Jade Empire','Ember Horde','Stone Kin','River Folk','Ash Legion','Gold Throne','Storm Riders','Thorn Covenant','Bronze League','Moon Order','Wolf Clans','Salt Lords','Crimson Court','Oak Wardens','Dune Raiders','Silver Crown','Raven Host','Marsh Kingdom','Highland Earls','Copper Duchy','Amber Realm','Night Watch','Sky Archers','Granite Hold','Viper Guild','Lion Banner','Coral Republic'];
function civHex(i){let h=(i*137.508+8)%360;if(h>185&&h<260)h=(h+95)%360;return '#'+new THREE.Color().setHSL(h/360,.62+(i%3)*.08,.4+(i%4)*.05).getHexString();}
const CIVSTART=[{army:{sword:3,spear:0,archer:2,knight:0}},{army:{sword:4,spear:2,archer:3,knight:0}},{army:{sword:5,spear:3,archer:4,knight:1}},{army:{sword:6,spear:4,archer:5,knight:3}}];
const NCIV=30;
const MP_SLOTS=[[84,84],[172,172],[172,84],[84,172]];
function genWorld(seed,homes){
  const rand=mulberry32(seed);
  const nf=makeNoise(rand,9),nf2=makeNoise(rand,3.5),nw=makeNoise(rand,16);
  const tiles=new Uint8Array(W*H),rq=new Uint8Array(W*H);
  const hd=(x,y)=>{let m=1e9;for(const [hx,hy] of homes)m=Math.min(m,Math.hypot(x-hx,y-hy));return m;};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const d=hd(x,y);
    const f=nf(x,y)*0.75+nf2(x,y)*0.25+Math.max(0,0.24*(1-d/26));
    let t=GRASS;
    if(nw(x,y)>0.73&&d>12)t=WATER;
    else if(f>0.52)t=TREE;
    else if(rand()<0.028)t=ROCK;
    tiles[y*W+x]=t;
  }
  for(const [sx,sy] of homes){for(let y=sy-5;y<=sy+5;y++)for(let x=sx-5;x<=sx+5;x++)if(Math.hypot(x-sx,y-sy)<=3.8)tiles[y*W+x]=GRASS;
    for(const [x,y] of [[sx+3,sy-3],[sx-3,sy+3],[sx+3,sy+3]])tiles[y*W+x]=ROCK;}
  const civs=[];let tries=0;
  while(civs.length<NCIV&&tries<40000){tries++;const bx=12+Math.floor(rand()*(W-24)),by=12+Math.floor(rand()*(H-24));
    if(hd(bx,by)<27)continue;if(civs.some(c=>Math.hypot(c.x-bx,c.y-by)<20))continue;
    const i=civs.length;const d=hd(bx,by);const lv=d<48?1:d<78?2:d<108?3:4;const wall=Math.min(lv,Math.max(0,lv-1+(rand()<.35?1:0)));
    const army=Object.assign({},CIVSTART[lv-1].army);army.sword+=Math.floor(rand()*2);
    civs.push({i,x:bx,y:by,name:CIVNAMES[i],hex:civHex(i),lv,wall,army,captured:false,growT:25+rand()*30,upT:200+rand()*160});}
  for(const c of civs){const bx=c.x,by=c.y;
    for(let y=by-8;y<=by+8;y++)for(let x=bx-8;x<=bx+8;x++){if(x<0||y<0||x>=W||y>=H)continue;const d=Math.hypot(x-bx,y-by);if(d<=6)tiles[y*W+x]=DIRT;else if(d<=8&&tiles[y*W+x]===WATER)tiles[y*W+x]=GRASS;}
    let best=homes[0],bd=1e9;for(const h of homes){const d=Math.hypot(h[0]-bx,h[1]-by);if(d<bd){bd=d;best=h;}}const [sx,sy]=best;
    const steps=Math.ceil(bd*2);for(let s=0;s<=steps;s++){const x=Math.round(sx+(bx-sx)*s/steps),y=Math.round(sy+(by-sy)*s/steps);for(const [dx,dy] of [[0,0],[1,0],[0,1]]){const k=(y+dy)*W+x+dx;if(tiles[k]===WATER)tiles[k]=DIRT;}}}
  for(let i=0;i<W*H;i++)if(tiles[i]===ROCK)rq[i]=4;
  return {tiles,rq,civs};
}

function rle(a){const out=[];let prev=a[0],n=1;for(let i=1;i<=a.length;i++){if(i<a.length&&a[i]===prev)n++;else{out.push(n>1?prev+'*'+n:''+prev);prev=a[i];n=1;}}return out.join(',');}

function isBlocked(tx,ty){if(tx<0||ty<0||tx>=W||ty>=H)return true;const i=ty*W+tx,t=G.tiles[i];if(t===TREE||t===ROCK||t===WATER)return true;return bAt.has(i)||cmask[i]>=0;}

function overlapsTile(e,i,r=11){const tx=i%W,ty=(i/W)|0;return e.x+r>tx*T&&e.x-r<(tx+1)*T&&e.y+r>ty*T&&e.y-r<(ty+1)*T;}
function unstick(){if(!hitAt(player.x,player.y,11))return;const px=Math.floor(player.x/T),py=Math.floor(player.y/T);

function findPath(gx,gy,adj,trees){
  const sx=Math.floor(player.x/T),sy=Math.floor(player.y/T),s=sy*W+sx;
  const goal=(x,y)=>adj?(Math.max(Math.abs(x-gx),Math.abs(y-gy))===1):(x===gx&&y===gy);
  const blocked=(x,y)=>{if(!isBlocked(x,y))return false;if(!trees)return true;const i=y*W+x;return !(G.tiles[i]===TREE&&!bAt.has(i)&&cmask[i]<0);};
  if(goal(sx,sy))return [];
  const prev=new Int32Array(W*H).fill(-2);prev[s]=-1;const q=[s];let qi=0;
  while(qi<q.length&&q.length<14000){const c=q[qi++],cx=c%W,cy=(c/W)|0;
    for(const [dx,dy] of D4){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const ni=ny*W+nx;if(prev[ni]!==-2||blocked(nx,ny))continue;prev[ni]=c;
      if(goal(nx,ny)){const p=[];let k=ni;while(k!==s){p.push(k);k=prev[k];}return p.reverse();}
      q.push(ni);}}
  return null;}

function genBattleTerrain(kind,lv,nh,field){const t=new Uint8Array(C*R),rnd=Math.random,bld=[];

    for(let c=0;c<C;c++)for(let r=0;r<R;r++)if((c<=2||c>=13)&&t[c+r*C]!==OPEN)t[c+r*C]=OPEN;return {t,bld};}
  const nf=2+Math.floor(rnd()*2);for(let i=0;i<nf;i++)blob(FOREST,4+Math.floor(rnd()*4),f0,f1);
  for(let i=0;i<2;i++)blob(HILL,3,f0,f1);
  const nr=2+Math.floor(rnd()*2);for(let i=0;i<nr;i++){const c=(att?4:8)+Math.floor(rnd()*4),r=Math.floor(rnd()*R);t[c+r*C]=RCK;}

const zoneMax=()=>B.co||B.coop?5:B.kind==='attack'?2:5;

function firstAvail(){for(const t of ['sword','spear','archer','knight',...WEAPONS])if(B.pool[t]>0)return t;return null;}

function stepUnit(u,dt){const D=UDEF[u.type];u.cd-=dt;u.mt-=dt;if(!D.atk)return;

function worldClick(x,y,btn){if(btn===2){buildSel=null;updBB();return;}
  const h=pickGround(WS.camera,x,y);if(!h)return;const tx=Math.floor(h.x),ty=Math.floor(h.z);if(tx<0||ty<0||tx>=W||ty>=H)return;

  if(buildSel){placeBuilding(buildSel,tx,ty);return;}
  {let best=null,bd=1.8;for(const [t,r] of ixTargets()){const d=Math.hypot(r.x-h.x,r.y-h.z);if(d<bd){bd=d;best=t;}}if(best){openMarch(G.march||best.pvp!=null?null:{ix:best});return;}}
  for(const dy of [0,1,2]){if(ty+dy>=H)continue;const i=(ty+dy)*W+tx;const cm=cmask[i];
    if(cm===OWN){openCity();return;}if(cm>=100){openMarch({pvp:cm-100});return;}if(cm>=0&&G.explored[i]){const c=G.civs[cm];if(c.captured&&!G.march){openMarch(null,c.i);return;}openMarch(c.captured||c.taken!=null?null:{civ:cm});return;}
    if((G.tiles[i]===TREE||G.tiles[i]===ROCK)&&G.explored[i]){setGather(i);return;}}
  goToTile(tx,ty);}
function battleClick(x,y){if(!B||B.phase!=='deploy')return;const h=pickGround(BS.camera,x,y);if(!h)return;const c=Math.floor(h.x/S+C/2),r=Math.floor(h.z/S+R/2);
  if(c<0||r<0||c>=C||r>=R)return;
  const ex=B.units.find(u=>u.side===0&&u.c===c&&u.r===r);
  if(ex&&ex.co!=null){toast(`That's 👤 ${B.co?B.co.name:'your partner'}'s soldier.`);return;}
  if(ex&&B.coop&&ex.id<1e6){toast("That's your partner's soldier.");return;}
  if(ex&&ex.fixed){toast('Walls and weapons set themselves up. You only position your army.');return;}
  if(c>zoneMax()||!rowOK(r)){toast(B.co||B.coop?'Place units in your own (blue) half of the zone.':'Place units in the blue zone.');return;}
  if(B.coop&&B.ready){toast('You marked yourself ready. Tap "Not ready" to change your setup.');return;}
  if(ex){B.units.splice(B.units.indexOf(ex),1);B.pool[ex.type]++;B.sel=ex.type;buildPalette();if(B.coop)coSend();return;}
  if(!B.sel||B.pool[B.sel]<=0){toast('No more of that unit. Pick another one below.');return;}
  if(!cellFree(c,r)){toast("Can't place there.");return;}
  addUnit(B.sel,0,c,r,B.coop?pMult(B.sel):1);B.pool[B.sel]--;if(B.pool[B.sel]<=0)B.sel=firstAvail();buildPalette();if(B.coop)coSend();}

/* ================= MULTIPLAYER ================= */
const MP={room:null,code:null,pushT:0,last:'',seen:{},warned:{},mobj:{},lastBt:{},btSeen:{},coDone:{}};
const PCOL=['#f0c419','#f4f4f4','#ff7ac8','#3ee0b0'];
const pvpHex=k=>PCOL[k];
function pvpCiv(k){const o=G.others[k];if(!o)return null;const [x,y]=MP_SLOTS[k];return {i:-1,pvp:+k,name:o.name,hex:pvpHex(+k),x,y,lv:o.lv||1,wall:o.wall||0,army:Object.assign({sword:0,spear:0,archer:0,knight:0},o.army||{}),weapons:o.weapons||{},res:o.res||{}};}
function mpMarches(){const out=[];if(!G||!G.mp)return out;for(const k in G.others){const o=G.others[k],m=o.march;if(!o.online||!m)continue;
  const L=Math.max(1,Math.round(Math.hypot(m.t[0]-m.o[0],m.t[1]-m.o[1])));const f=Math.min(1,m.f+((Date.now()-o.seenAt)/1000)*MSPD/L);
  const cx=Math.round(m.o[0]+(m.t[0]-m.o[0])*f),cy=Math.round(m.o[1]+(m.t[1]-m.o[1])*f),key=k+(m.id||'')+m.s;const obj=MP.mobj[key]||(MP.mobj[key]={});
  Object.assign(obj,{path:[Math.round(m.t[1])*W+Math.round(m.t[0])],start:Math.max(0,Math.min(H-1,cy))*W+Math.max(0,Math.min(W-1,cx)),idx:0,prog:0,units:m.u||{},hex:pvpHex(+k),label:`${o.name}'s army${m.pvp===G.mp.slot&&m.s==='going'?' → YOU':''}`,atMe:m.pvp===G.mp.slot&&m.s==='going',key,ix:m.s==='going'&&m.id?{pvp:k,mid:m.id}:null});out.push(obj);}
  for(const k in G.others){const o=G.others[k];if(!o.online)continue;for(const a of (o.em||[])){const c=G.civs[a.civ];if(!c)continue;const p=pvpEmPos(o,a),key='e'+k+a.id;const obj=MP.mobj[key]||(MP.mobj[key]={});
    const cx=Math.max(0,Math.min(W-1,Math.round(p[0]))),cy=Math.max(0,Math.min(H-1,Math.round(p[1])));
    Object.assign(obj,{path:[Math.round(a.t[1])*W+Math.round(a.t[0])],start:cy*W+cx,idx:0,prog:0,units:a.u||{},hex:c.hex,label:`⚠ ${c.name} → ${o.name}`,key,ix:{pai:k,eid:a.id}});out.push(obj);}}
  return out;}
function mpState(){const m=G.march;return {v:3,code:G.mp.code,seed:G.seed,slot:G.mp.slot,name:G.mp.name,lv:G.city.lv,wall:G.city.wall,weapons:{turret:G.up.turret,ballista:G.up.ballista,catapult:G.up.catapult},
  army:G.army,res:{wood:G.res.wood|0,stone:G.res.stone|0,gold:G.res.gold|0},cap:G.civs.filter(c=>c.captured).map(c=>c.i),
  march:m?{id:m.id,s:m.state,pvp:m.pvp,c:m.civ,ki:m.kind==='intercept'?'ix':m.kind==='join'?'jn':undefined,jn:m.kind==='join'?m.tgt:undefined,j:m.joined?1:0,o:[...marchPos(m).slice(0,2)],t:m.state==='going'?[(mTarget(m)||{x:0}).x,(mTarget(m)||{y:0}).y]:[m.origin.x,m.origin.y],f:0,u:m.units}:null,em:G.emarch.slice(0,3).map(e=>{const p=marchPos(e);return {id:emId(e),civ:e.civ,x:Math.round(p[0]*10)/10,y:Math.round(p[1]*10)/10,t:[G.home.x+.5,G.home.y+.5],u:e.units};}),raids:G.raidsOut.slice(-4),p:[Math.round(player.x/T*10)/10,Math.round(player.y/T*10)/10,Math.round(player.ang*100)/100,player.moving||player.working?1:0]};}
function mpPush(force){if(!MP.room||!G||!G.mp)return;const st=mpState();const j=JSON.stringify(st);if(!force&&j===MP.last)return;MP.last=j;MP.room.presence({st}).catch(()=>{});}
function mpTick(dt){if(!G.mp)return;MP.pushT-=dt;MP.hb=(MP.hb||0)-dt;if(MP.pushT<=0){MP.pushT=.4;if(MP.hb<=0){MP.hb=8;mpPush(true);}else mpPush();for(const k in G.others)G.others[k].online=!!MP.seen[k]&&Date.now()-MP.seen[k]<15000;}}
function mpHandlePeers(peers){if(!G||!G.mp)return;let changed=false;
  for(const p of peers){if(p.sameTab)continue;const st=p.presence&&p.presence.st;if(!st||st.v!==3||st.code!==G.mp.code||st.slot===G.mp.slot||st.slot==null||st.slot<0||st.slot>3)continue;
    const k=st.slot;MP.seen[k]=Math.min(Date.now(),+(p.presence.t||Date.now()));const name=String(st.name||'Player').slice(0,20);if(!G.others[k])changed=true;
    const pp=Array.isArray(st.p)&&st.p.length>=4?st.p.map(Number):null;G.others[k]={pos:pp,name,lv:+st.lv||1,wall:+st.wall||0,weapons:st.weapons||{},army:st.army||{},res:st.res||{},march:st.march||null,em:Array.isArray(st.em)?st.em:[],online:Date.now()-MP.seen[k]<15000,seenAt:MP.seen[k]};
    for(const i of (st.cap||[])){const c=G.civs[i];if(c&&!c.captured&&c.taken==null){c.taken=k;c.ally=null;changed=true;}}
    for(const r of (st.raids||[])){if(r.to!==G.mp.slot||G.mpDone.includes(r.id))continue;G.mpDone.push(r.id);
      if(r.kind==='co'){const m=G.march;if(m&&m.kind==='join'){G.march=null;sendHome(r.back||{},{x:r.tx|0,y:Math.max(0,(r.ty|0)-3),i:-1},m.origin);}G.res.gold+=r.gold|0;
        if(B&&B.coop&&B.btId===r.bt){B.coRes=r;if(!B.endAt)B.endAt=Date.now()+3000;}else if(!(B&&B.coop))coResultModal(r);changed=true;continue;}
      if(r.kind==='ix'){const m=G.march;if(m&&m.id===r.mid){for(const t of ARMY_T)m.units[t]=Math.max(0,(m.units[t]||0)-((r.lost||{})[t]|0));
          if(r.win||!armyTotal(m.units)){G.march=null;showModal(`<h2>💀 👤 ${name} ambushed your army!</h2><p>Their soldiers caught your army on the march and destroyed it before it reached its target.</p>`,[{t:'OK',primary:true}]);}
          else showModal(`<h2>⚔ 👤 ${name} ambushed your army!</h2><p>Your army fought them off and keeps marching, but lost ${compText(r.lost)||'no soldiers'}.</p>`,[{t:'OK',primary:true}]);}
        changed=true;continue;}
      if(r.kind==='ixai'){const e=G.emarch.find(e=>emId(e)===r.eid);if(e){const c=G.civs[e.civ];
          if(r.win){G.emarch=G.emarch.filter(x=>x!==e);showModal(`<h2>🤝 👤 ${name} saved you!</h2><p>Their army intercepted the <b style="color:${c.hex}">${c.name}</b> army that was marching on your city and wiped it out.</p>`,[{t:'Nice!',primary:true}]);}
          else{for(const t of ARMY_T)e.units[t]=Math.max(0,(e.units[t]||0)-((r.lost||{})[t]|0));if(!armyTotal(e.units))G.emarch=G.emarch.filter(x=>x!==e);toast(`⚔ 👤 ${name} attacked the ${c.name} army marching on you. It lost ${compText(r.lost)||'no soldiers'}.`);}}
        changed=true;continue;}
      for(const t of ARMY_T)G.army[t]=Math.max(0,G.army[t]-((r.lost||{})[t]|0));for(const kk of ['wood','stone','gold'])G.res[kk]=Math.max(0,G.res[kk]-((r.stolen||{})[kk]|0));
      if(r.win&&G.city.wall>0)G.city.wall--;
      showModal(r.win?`<h2>🔥 👤 ${name} raided your city!</h2><p>Their army broke through and carried off <b>${costStr(r.stolen)||'nothing'}</b>. You lost ${compText(r.lost)||'no soldiers'}${G.city.wall>=0?' and your walls were damaged':''}.</p>`:`<h2>🛡 You held off 👤 ${name}!</h2><p>Their army attacked your city and was beaten. You lost ${compText(r.lost)||'no soldiers'}.</p>`,[{t:'OK',primary:true}]);changed=true;}
    const bt=p.presence.bt;
    if(bt&&bt.co===G.mp.slot&&Math.abs(Date.now()-(bt.ts||0))<20000){if(B&&B.coop&&B.btId===bt.id)spectApply(bt);
      else if(mode==='world'&&bt.ph!=='done'&&!MP.coDone[bt.id]&&G.march&&G.march.kind==='join'&&String(G.march.tgt.k)===String(k))coStart(bt,k);}
    const cp=p.presence.cp;if(cp&&B&&B.co&&String(B.co.k)===String(k)&&cp.id===B.btId&&cp.ts!==B.co.cpTs){B.co.cpTs=cp.ts;coSync(cp);}
    {const om=st.march;if(om&&om.jn&&om.j&&G.march&&om.jn.mid===G.march.id&&String(om.jn.k)===String(G.mp.slot)&&!MP.warned['j'+om.id]){MP.warned['j'+om.id]=1;toast(`🤝 👤 ${name}'s army joined your march! You'll set up and fight together.`);}}
    if(bt&&bt.to===G.mp.slot&&Math.abs(Date.now()-(bt.ts||0))<20000){MP.lastBt[k]=bt;
      if(B&&B.spect&&B.btId===bt.id)spectApply(bt);
      else if(!B&&mode==='world'&&bt.ph!=='done'&&!MP.btSeen[bt.id]){MP.btSeen[bt.id]=1;const kk=k;showModal(`<h2>⚔ 👤 ${name} is attacking your city!</h2><p>Their army has reached your walls and the battle is happening right now. Your walls, weapons and the soldiers you have at home are defending.</p>`,[{t:'👁 Watch the battle',primary:true,fn:()=>spectStart(MP.lastBt[kk],kk)},{t:'Not now'}]);}}
    const mm=st.march;if(mm&&mm.pvp===G.mp.slot&&mm.s==='going'&&!MP.warned[mm.id]){MP.warned[mm.id]=1;if(mode==='world'&&paused===false)showModal(`<h2>⚠ 👤 ${name} is marching on your city!</h2><p>Their army: <b>${compText(mm.u)}</b>. When they arrive, they'll fight your walls, weapons and the soldiers you have at home.</p>`,[{t:'Prepare!',primary:true}]);}}
  if(changed){recompute();updHUD();save(true);}else updHUD();}
function loadScript(src){return new Promise((res,rej)=>{const e=document.createElement('script');e.src=src;e.onload=res;e.onerror=rej;document.head.appendChild(e);});}
let FB=null;
async function fbInit(){if(FB)return FB;const cfg=window.FIREBASE_CONFIG;if(!cfg||!cfg.apiKey||!cfg.databaseURL)return null;const base='https://www.gstatic.com/firebasejs/10.12.2/';
  if(!window.firebase){await loadScript(base+'firebase-app-compat.js');await loadScript(base+'firebase-auth-compat.js');await loadScript(base+'firebase-database-compat.js');}
  if(!firebase.apps.length)firebase.initializeApp(cfg);const cred=await firebase.auth().signInAnonymously();FB={db:firebase.database(),uid:cred.user.uid};return FB;}
async function fbJoin(code){const fb=await fbInit();if(!fb)return null;const ref=fb.db.ref('rooms/'+code+'/players'),me=ref.child(fb.uid);let peers=[];const cbs=[],ecbs=[];
  ref.on('value',snap=>{const v=snap.val()||{};peers=Object.entries(v).map(([k,p])=>({peer:k,sameTab:k===fb.uid,presence:{st:p&&p.st,t:p&&p.t,bt:p&&p.bt,cp:p&&p.cp}}));for(const cb of cbs)cb({peers});},err=>{for(const e of ecbs)e(err);});
  return {battle:(o)=>o?me.child('bt').set(JSON.parse(JSON.stringify(o))):me.child('bt').remove(),coop:(o)=>o?me.child('cp').set(JSON.parse(JSON.stringify(o))):me.child('cp').remove(),presence:async(patch)=>{await me.update({st:JSON.parse(JSON.stringify(patch.st)),t:firebase.database.ServerValue.TIMESTAMP});},peers:()=>peers,onPeers:(cb,onErr)=>{cbs.push(cb);if(onErr)ecbs.push(onErr);if(peers.length)setTimeout(()=>cb({peers}),0);return()=>{};}};}
async function mpConnect(code){MP.code=code;try{if(!window.FIREBASE_CONFIG||!window.FIREBASE_CONFIG.apiKey){toast('🌐 Multiplayer is not set up yet for this copy of the game.');return null;}
    const nr=await fbJoin(code);if(!nr){toast('🌐 Could not connect to the online room. Your game continues offline.');return null;}
    MP.room=nr;nr.onPeers(ch=>mpHandlePeers(ch.peers),()=>{MP.room=null;updHUD();});if(G&&G.mp)mpPush(true);updHUD();return nr;}
  catch(e){console.error(e);toast('🌐 Could not connect to the online room. Your game continues offline.');return null;}}
function mpCode(){const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function openMultiplayer(){
  showModal(`<h2>🌐 Multiplayer</h2><p>Play on the same map as a friend. Each of you runs your own civilization. You'll see each other's cities and marching armies, and you can send armies to raid each other.</p>
  <p style="opacity:.8;font-size:13px">No account needed. Send your friend the link to this game and your room code; they press 🌐 Multiplayer → Join and type it in.</p>
  <p><b>Your name:</b> <input id="mpName" maxlength="16" value="${(G&&G.mp&&G.mp.name)||'Player'}" style="font:inherit;padding:6px 8px;border-radius:8px;border:1px solid #5c8f5f;background:#0f1712;color:#fff;width:160px"></p>
  <div class="urow"><div class="ic">✨</div><div class="info"><b>Create a game</b><br>Get a room code to give your friend.</div><div class="tb"><button class="btn primary" id="mpCreate">Create</button></div></div>
  <div class="urow"><div class="ic">🔑</div><div class="info"><b>Join a game</b><br><input id="mpCode" maxlength="5" placeholder="CODE" style="font:inherit;text-transform:uppercase;letter-spacing:3px;padding:6px 8px;border-radius:8px;border:1px solid #5c8f5f;background:#0f1712;color:#fff;width:110px;margin-top:4px"></div><div class="tb"><button class="btn primary" id="mpJoin">Join</button></div></div>
  <p id="mpMsg" style="min-height:1.2em;color:#ffd166"></p>`,[{t:'Back',fn:title}]);
  const nm=()=>($('mpName').value||'Player').trim().slice(0,16)||'Player';
  $('mpCreate').onclick=()=>{const code=mpCode();newGame({mp:{code,slot:0,name:nm()}});};
  $('mpJoin').onclick=async()=>{const code=($('mpCode').value||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(code.length<4){$('mpMsg').textContent='Type the code your friend gave you.';return;}
    $('mpMsg').textContent='Connecting…';const nr=await mpConnect(code);if(!nr){$('mpMsg').textContent='Could not connect. Make sure you are signed in and were invited to this game.';return;}
    let host=null;for(let k=0;k<40&&!host;k++){await new Promise(r=>setTimeout(r,250));for(const p of nr.peers()){const st=p.presence&&p.presence.st;if(st&&st.v===3&&st.code===code&&!p.sameTab)host=host||st;}}
    if(!host){$('mpMsg').textContent='Nobody is playing with that code right now. Check the code, and make sure your friend has the game open.';return;}
    const used=new Set();for(const p of nr.peers()){const st=p.presence&&p.presence.st;if(st&&st.code===code&&!p.sameTab)used.add(st.slot);}
    const slot=[0,1,2,3].find(i=>!used.has(i));if(slot==null){$('mpMsg').textContent='That game is full (4 players).';return;}
    newGame({seed:host.seed,mp:{code,slot,name:nm()}});};}

let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  try{if(mode==='world'&&G){if(!paused)updateWorld(dt);if(mode==='world')renderWorld(dt);else if(mode==='battle'&&B)renderBattle(dt);}
  else if(mode==='battle'&&B){if(!paused)updateBattle(dt);else if(B.btId&&!B.spect){B.btHb=(B.btHb||0)-dt;if(B.btHb<=0){B.btHb=1;btPush();}}if(mode==='battle'&&B)renderBattle(dt);else if(G&&WS)renderWorld(dt);}
  else renderTitle(dt);}catch(err){console.error(err);}
  requestAnimationFrame(loop);}
makeBuildBar();title();requestAnimationFrame(loop);
